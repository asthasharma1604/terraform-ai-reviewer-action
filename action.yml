name: 'AI Terraform PR Reviewer'
description: 'Reviews Terraform Code with OpenAI for dangerous changes, security risks, cost optimization, architecture improvements, and code fixes.'

inputs:
  openai_api_key:
    description: 'API Key for OpenAI'
    required: true
  github_token:
    description: 'GitHub Token'
    required: true
  plan_path:
    description: 'Path to the Terraform plan file'
    required: false

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install PyGithub openai pydantic
      shell: bash

    - name: Run AI Analysis
      shell: bash
      run: |
        export OPENAI_API_KEY="${{ inputs.openai_api_key }}"
        export GITHUB_TOKEN="${{ inputs.github_token }}"
        export PR_NUMBER="${{ github.event.pull_request.number }}"
        export REPO_NAME="${{ github.repository }}"
        export GITHUB_SHA="${{ github.sha }}"
        export PLAN_PATH="${{ inputs.plan_path }}"
        python -u "${{ github.action_path }}/review.py" --mode analyze

    - name: Dangerous Changes
      shell: bash
      run: |
        export GITHUB_TOKEN="${{ inputs.github_token }}"
        export PR_NUMBER="${{ github.event.pull_request.number }}"
        export REPO_NAME="${{ github.repository }}"
        export GITHUB_SHA="${{ github.sha }}"
        python -u "${{ github.action_path }}/review.py" --mode dangerous

    - name: Security Review
      shell: bash
      run: |
        export GITHUB_TOKEN="${{ inputs.github_token }}"
        export PR_NUMBER="${{ github.event.pull_request.number }}"
        export REPO_NAME="${{ github.repository }}"
        export GITHUB_SHA="${{ github.sha }}"
        python -u "${{ github.action_path }}/review.py" --mode security

    - name: Cost Optimization
      shell: bash
      run: |
        export GITHUB_TOKEN="${{ inputs.github_token }}"
        export PR_NUMBER="${{ github.event.pull_request.number }}"
        export REPO_NAME="${{ github.repository }}"
        export GITHUB_SHA="${{ github.sha }}"
        python -u "${{ github.action_path }}/review.py" --mode cost

    - name: Architecture Suggestions
      shell: bash
      run: |
        export GITHUB_TOKEN="${{ inputs.github_token }}"
        export PR_NUMBER="${{ github.event.pull_request.number }}"
        export REPO_NAME="${{ github.repository }}"
        export GITHUB_SHA="${{ github.sha }}"
        python -u "${{ github.action_path }}/review.py" --mode architecture

    - name: Fix Suggestions
      shell: bash
      run: |
        export GITHUB_TOKEN="${{ inputs.github_token }}"
        export PR_NUMBER="${{ github.event.pull_request.number }}"
        export REPO_NAME="${{ github.repository }}"
        export GITHUB_SHA="${{ github.sha }}"
        python -u "${{ github.action_path }}/review.py" --mode fixes

    - name: Post Inline PR Comments
      shell: bash
      run: |
        export GITHUB_TOKEN="${{ inputs.github_token }}"
        export PR_NUMBER="${{ github.event.pull_request.number }}"
        export REPO_NAME="${{ github.repository }}"
        export GITHUB_SHA="${{ github.sha }}"
        export PLAN_PATH="${{ inputs.plan_path }}"
        python -u "${{ github.action_path }}/review.py" --mode inline
