name: 'AI Terraform PR Reviewer'
description: 'Analyzes Terraform Pull Requests for security and cost issues using OpenAI.'

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install PyGithub openai pydantic google-genai
      shell: bash

    - name: Run AI Review Script
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.REVIEW_CODE_TOKEN }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO_NAME: ${{ github.repository }}
      run: python ${{ github.action_path }}/review.py
      shell: bash