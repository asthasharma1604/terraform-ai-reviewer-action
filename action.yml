name: 'AI Terraform PR Reviewer'
description: 'Analyzes Terraform Pull Requests for security and cost issues using OpenAI.'

inputs:
  gemini_api_key:
    description: 'API Key for Google Gemini'
    required: true

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install PyGithub openai pydantic google-genai
      shell: bash

    - name: Run AI Review
      shell: bash
      env:
        GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
        PR_NUMBER: ${{ env.PR_NUMBER }}
      run: python ${{ github.action_path }}/review.py