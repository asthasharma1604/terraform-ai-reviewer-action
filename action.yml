name: 'AI Terraform PR Reviewer'
description: 'Reviews Terraform Code with OpenAI for dangerous changes, security risks, cost optimization, architecture improvements, and code fixes.'

inputs:
  openai_api_key:
    description: 'API Key for OpenAI'
    required: true
  github_token:
    description: 'GitHub Token'
    required: true

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install PyGithub openai pydantic
      shell: bash

    - name: 🧠 Run AI Analysis
      env:
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO_NAME: ${{ github.repository }}
        PLAN_PATH: ${{ inputs.plan_path }}
      run: python -u ${{ github.action_path }}/review.py --mode analyze
      shell: bash

    - name: 🚨 Dangerous Changes
      run: python -u ${{ github.action_path }}/review.py --mode dangerous
      shell: bash

    - name: 🔒 Security Review
      run: python -u ${{ github.action_path }}/review.py --mode security
      shell: bash

    - name: 💰 Cost Optimization
      run: python -u ${{ github.action_path }}/review.py --mode cost
      shell: bash

    - name: 🏗️ Architecture Suggestions
      run: python -u ${{ github.action_path }}/review.py --mode architecture
      shell: bash

    - name: ✨ Fix Suggestions
      run: python -u ${{ github.action_path }}/review.py --mode fixes
      shell: bash
    
    - name: 💬 Post Inline PR Comments
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }} # It needs this to write comments!
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO_NAME: ${{ github.repository }}
      run: python -u ${{ github.action_path }}/review.py --mode inline
      shell: bash
