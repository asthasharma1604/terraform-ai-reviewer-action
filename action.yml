name: 'AI Terraform PR Reviewer'
description: 'Analyzes Terraform Pull Requests for security and cost issues using AI.'

inputs:
  gemini_api_key:
    description: 'API Key for Google Gemini'
    required: true
  github_token:
    description: 'GitHub Token'
    required: true

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install PyGithub openai pydantic google-genai
      shell: bash

      # Security Analysis
    - name: 🔒 Security Review
      env:
        GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO_NAME: ${{ github.repository }}
      run: python ${{ github.action_path }}/review.py --mode security
      shell: bash

      # Cost Analysis
    - name: 💰 Cost Optimization
      env:
        GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO_NAME: ${{ github.repository }}
      run: python ${{ github.action_path }}/review.py --mode cost
      shell: bash

      # Suggested Fixes
    - name: ✨ Fix Suggestions
      env:
        GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO_NAME: ${{ github.repository }}
      run: python ${{ github.action_path }}/review.py --mode fixes
      shell: bash
